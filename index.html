<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>جزدانی من - ژمێریاری کەسی بۆ خەرج و داهات</title>
<meta name="description" content="جزدانی من: ئەپی بێبەرامبەر بۆ تۆمارکردنی خەرج و داهاتی مانگانە و سالانە، بودجە، ئامانجی پاشەکەوت و یادخستنەوەی قەرز.">
<meta name="theme-color" content="#17308f">
<meta property="og:title" content="جزدانی من - ژمێریاری کەسی">
<meta property="og:description" content="خەرج و داهاتی مانگانە و سالانەت بە ئاسانی تۆمار بکە.">
<meta property="og:type" content="website">
<meta name="robots" content="index,follow">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f8ff;--card:#fff;--text:#0f1f3d;--muted:#5b6b8a;--blue:#1d4ed8;--blue2:#1e3a8a;--yellow:#facc15;--line:#dbe5f7;--red:#c2410c;--green:#15803d;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1530;--card:#13224a;--text:#f1f5ff;--muted:#9fb0d6;--blue:#3b6cf0;--blue2:#0f1d44;--line:#233a73;--red:#fb923c;--green:#4ade80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1530;--card:#13224a;--text:#f1f5ff;--muted:#9fb0d6;--blue:#3b6cf0;--blue2:#0f1d44;--line:#233a73;--red:#fb923c;--green:#4ade80;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Vazirmatn','Noto Naskh Arabic',Tahoma,sans-serif;line-height:1.6}
header{background:var(--blue2);color:#fff;padding:18px 16px 14px;text-align:center;border-bottom:4px solid var(--yellow)}
header h1{margin:0;font-size:22px}
header h1 span{color:var(--yellow)}
main{max-width:760px;margin:0 auto;padding:14px}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1;padding:10px;border:2px solid var(--blue);background:var(--card);color:var(--blue);border-radius:12px;font:inherit;font-weight:600;cursor:pointer}
.tabs button.on{background:var(--blue);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nav b{font-size:18px}
.nav button{background:var(--yellow);color:#0f1f3d;border:0;border-radius:10px;width:40px;height:40px;font-size:18px;font-weight:800;cursor:pointer}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sum div{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.sum small{color:var(--muted);display:block}
.sum b{font-size:15px;word-break:break-all}
.in{color:var(--green)}.out{color:var(--red)}
.seg{display:flex;gap:6px;margin-bottom:10px}
.seg button{flex:1;padding:9px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--text);font:inherit;cursor:pointer}
.seg button.on{background:var(--yellow);border-color:var(--yellow);color:#0f1f3d;font-weight:700}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
input,select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;margin-bottom:8px}
.add{width:100%;padding:12px;border:0;border-radius:12px;background:var(--blue);color:#fff;font:inherit;font-weight:700;font-size:16px;cursor:pointer}
h3{margin:0 0 10px;font-size:16px;color:var(--blue)}
@media (prefers-color-scheme:dark){h3{color:var(--yellow)}}
.bar{margin-bottom:8px}
.bar .t{display:flex;justify-content:space-between;font-size:14px}
.bar .b{height:8px;background:var(--line);border-radius:6px;overflow:hidden}
.bar .b i{display:block;height:100%;background:var(--yellow)}
.tx{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.tx:last-child{border:0}
.tx .m{flex:1;min-width:0}
.tx .m small{color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx button{background:none;border:0;color:var(--muted);font-size:18px;cursor:pointer}
.empty{text-align:center;color:var(--muted);padding:14px}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:420px}
th{background:var(--blue);color:#fff;padding:8px}
td{padding:8px;text-align:center;border-bottom:1px solid var(--line)}
tfoot td{background:var(--yellow);color:#0f1f3d;font-weight:800}
.note{font-size:12px;color:var(--muted);text-align:center;margin:6px 0 20px}
:root{--g1:#fde68a;--g2:#dbeafe}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--g1:#3a3410;--g2:#13224a}}
body{background:linear-gradient(160deg,var(--g2) 0,var(--bg) 45%,var(--g1) 135%) fixed}
header{background:linear-gradient(120deg,#1e3a8a,#2563eb 55%,#facc15 140%)}
header h1 span{color:#fff7c2}
.card{background:linear-gradient(145deg,var(--card),var(--bg));box-shadow:0 4px 14px rgba(29,78,216,.12)}
.sum div{background:linear-gradient(160deg,var(--card),var(--bg))}
.add,.tabs button.on{background:linear-gradient(120deg,#1d4ed8,#3b82f6)}
.nav button,.seg button.on{background:linear-gradient(135deg,#fde047,#fbbf24)}
.bar .b i,.prog i{background:linear-gradient(90deg,#3b82f6,#facc15)}
tfoot td{background:linear-gradient(90deg,#fde047,#fbbf24)}
.prog{height:12px;background:var(--line);border-radius:8px;overflow:hidden;margin:8px 0}
.prog i{display:block;height:100%;border-radius:8px}
.prog.over i{background:linear-gradient(90deg,#f97316,#dc2626)}
.two{display:flex;gap:8px;align-items:flex-start}.two input{margin-bottom:0}
textarea{width:100%;min-height:90px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;margin-bottom:8px;direction:ltr}
.logo{display:block;margin:0 auto 6px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.3))}
header .sub{font-size:13px;color:#fff7c2;letter-spacing:.5px}
:root{--bg:#f6f8fc;--card:#fff;--line:#e3e9f5;--text:#14213d;--muted:#64748b;--blue:#2347c5;--blue2:#17308f;--yellow:#f5b400;--red:#dc2626;--green:#16a34a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1228;--card:#111c3d;--line:#1f3166;--text:#eef2ff;--muted:#9aa9cf;--blue:#4f7cff;--red:#fb7185;--green:#4ade80}}
body{background:var(--bg)}
header{background:linear-gradient(135deg,#17308f,#2347c5 75%,#3b63d9);border-bottom:5px solid var(--yellow)}
.card{background:var(--card);box-shadow:0 2px 10px rgba(23,48,143,.08)}
.sum div{background:var(--bg)}
.add,.tabs button.on{background:var(--blue);color:#fff}
.tabs button{border-color:var(--blue);background:var(--card);color:var(--blue)}
.tabs button.on{color:#fff}
.nav button,.seg button.on{background:var(--yellow);color:#14213d}
.bar .b i,.prog i{background:linear-gradient(90deg,var(--blue),var(--yellow))}
tfoot td{background:var(--yellow);color:#14213d}
.ib{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--bg);border:1px solid var(--line);font-size:19px;flex:none}
.sum div.hero{background:linear-gradient(135deg,#17308f,#2347c5);border:0;color:#fff}
.sum div.hero small{color:#fde68a}
.sum div.hero b{color:#fff}
button{transition:transform .12s,opacity .12s}button:active{transform:scale(.96)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--yellow);border-color:var(--yellow)}
.card{border-radius:18px}
h3{display:flex;align-items:center;gap:6px}
h3::before{content:"";width:6px;height:18px;border-radius:4px;background:var(--yellow)}
.tx{padding:11px 0}
.sum b{font-size:16px}
.ch{display:flex;gap:4px;height:130px;margin-bottom:10px}.cc{flex:1;display:flex;flex-direction:column;align-items:center;height:100%}
.cb{flex:1;display:flex;align-items:flex-end;gap:2px;width:100%;justify-content:center}
.cb i{display:block;width:40%;min-height:2px;border-radius:4px 4px 0 0}
.ci{background:var(--blue)}.co{background:var(--yellow)}
.cc small{color:var(--muted);font-size:11px}
.lg{display:flex;gap:14px;justify-content:center;font-size:13px;margin-bottom:10px}
.lg i{display:inline-block;width:10px;height:10px;border-radius:3px}
</style>
</head>
<body>
<header><svg class="logo" viewBox="0 0 120 120" width="84" height="84" role="img" aria-label="لۆگۆی جزدان"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#1e3a8a"/></linearGradient><linearGradient id="cg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fde047"/><stop offset="1" stop-color="#f59e0b"/></linearGradient></defs><rect width="120" height="120" rx="28" fill="url(#lg)"/><circle cx="76" cy="36" r="20" fill="url(#cg)" stroke="#fff" stroke-width="3"/><circle cx="76" cy="36" r="12" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="2"/><rect x="16" y="50" width="88" height="54" rx="13" fill="#fff"/><path d="M16 66h88" stroke="#dbeafe" stroke-width="3"/><rect x="64" y="72" width="40" height="22" rx="11" fill="url(#cg)"/><circle cx="79" cy="83" r="4.5" fill="#fff"/></svg><h1>جزدانی <span>من</span></h1><div class="sub">ژمێریاری کەسی</div></header>
<main>
<div class="tabs"><button id="tm" class="on">مانگانە</button><button id="ty">سالانە</button><button id="tx">زیاتر</button></div>
<div id="app"></div>
<p class="note" id="sync">داتاکانت تەنها لەسەر ئەم ئامێرە/وێبگەڕەدا دەمێننەوە و کەس نایانبینێت. ئەگەر داتای وێبگەڕەکەت بسڕیتەوە، دەسڕێنەوە.</p>
</main>
<script>
var $=function(s){return document.querySelector(s)};
var MN=['کانوونی دووەم','شوبات','ئازار','نیسان','ئایار','حوزەیران','تەمموز','ئاب','ئەیلوول','تشرینی یەکەم','تشرینی دووەم','کانوونی یەکەم'];
var CO=['خۆراک','کرێ','گواستنەوە','کارەبا و ئاو','قەرز','تەندروستی','جلوبەرگ','خوێندن','تر'];
var CI=['مووچە','کار','تر'];
var S={tx:[]};
try{var r=localStorage.getItem('jizdan');if(r){S=JSON.parse(r)||S}}catch(e){}
S.budget=S.budget||0;S.goal=S.goal||{name:'',target:0,saved:0};
var DB=null,pt=null;
function ui(t){var e=$('#sync');if(e)e.textContent=t}
function push(){if(!DB)return;clearTimeout(pt);pt=setTimeout(function(){DB.doc('wallet').set({data:JSON.stringify(S)}).then(function(){ui('✅ لە ئەکاونتەکەت پارێزراوە و لە هەموو ئامێرێک دەبینرێت')}).catch(function(){ui('⚠️ نەتوانرا لە ئەکاونت بپارێزرێت؛ تەنها لەسەر ئەم ئامێرەیە')})},600)}
function save(){push();try{localStorage.setItem('jizdan',JSON.stringify(S))}catch(e){}}
var d=new Date(),vm=d.getMonth(),vy=d.getFullYear(),tab='m',ty='out';
function pad(n){return (n<10?'0':'')+n}
function f(n){return Math.round(n).toLocaleString('en-US')}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function today(){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function sum(list,t){return list.filter(function(x){return x.type===t}).reduce(function(a,x){return a+x.amt},0)}
function inMonth(y,m){var p=y+'-'+pad(m+1);return S.tx.filter(function(x){return x.date.slice(0,7)===p})}
function inYear(y){return S.tx.filter(function(x){return x.date.slice(0,4)==String(y)})}
function cats(){return ty==='out'?CO:CI}
function render(){
 $('#tm').className=tab==='m'?'on':'';$('#ty').className=tab==='y'?'on':'';$('#tx').className=tab==='x'?'on':'';
 var h='';S.debts=S.debts||[];
 if(tab==='m'){
  var L=inMonth(vy,vm),i=sum(L,'in'),o=sum(L,'out'),b=i-o;
  var dl=dueList();h+=dl.length?'<div class="card" style="border:2px solid var(--yellow)"><h3>⏰ ئاگادارکردنەوە</h3>'+dl.map(function(x){return '<div>'+esc(x.name)+' — <b>'+f(x.amt)+'</b> — '+x.date+(x.date<today()?' ⚠️':'')+'</div>'}).join('')+'</div>':'';
  h+='<div class="card"><div class="nav"><button onclick="mv(1)">›</button><b>'+MN[vm]+' '+vy+'</b><button onclick="mv(-1)">‹</button></div></div>';
  h+='<div class="card"><div class="sum"><div><small>داهات</small><b class="in">'+f(i)+'</b></div><div><small>خەرجی</small><b class="out">'+f(o)+'</b></div><div class="hero"><small>ماوە</small><b>'+f(b)+'</b></div></div></div>';
  var bg=S.budget,pc=bg>0?Math.min(100,Math.round(o/bg*100)):0;
  h+='<div class="card"><h3>بودجەی مانگانە</h3>'+(bg>0?'<div>خەرجی '+f(o)+' لە '+f(bg)+' ('+Math.round(o/bg*100)+'%)</div><div class="prog'+(o>bg?' over':'')+'"><i style="width:'+pc+'%"></i></div><div>'+(o>bg?'⚠️ لە بودجەکە تێپەڕیوی بە '+f(o-bg):'ماوەتەوە بۆ خەرجکردن: '+f(bg-o))+'</div>':'<div class="empty">هێشتا بودجەت دیاری نەکردووە</div>')+'<div class="two" style="margin-top:8px"><input id="bgi" type="number" inputmode="decimal" placeholder="بودجەی مانگانە (دینار)"><button class="add" style="width:auto;padding:0 18px;height:42px" onclick="setB()">دیاریکردن</button></div></div>';
  h+='<div class="card"><h3>زیادکردنی تۆمار</h3><div class="seg"><button id="so" class="'+(ty==='out'?'on':'')+'">خەرجی</button><button id="si" class="'+(ty==='in'?'on':'')+'">داهات</button></div>';
  h+='<div class="row2"><input id="am" type="number" inputmode="decimal" placeholder="بڕی پارە (دینار)"><select id="ct">'+cats().map(function(c){return '<option>'+c+'</option>'}).join('')+'</select></div>';
  h+='<div class="row2"><input id="dt" type="date" value="'+today()+'"><input id="nt" placeholder="تێبینی (ئارەزووییە)"></div>';
  h+='<button class="add" onclick="add()">زیادکردن ＋</button></div>';
  var ex=L.filter(function(x){return x.type==='out'}),by={};
  ex.forEach(function(x){by[x.cat]=(by[x.cat]||0)+x.amt});
  var ks=Object.keys(by).sort(function(a,c){return by[c]-by[a]});
  if(ks.length){h+='<div class="card"><h3>خەرجی بەپێی جۆر</h3>'+ks.map(function(k){var p=Math.round(by[k]/o*100);return '<div class="bar"><div class="t"><span>'+ic(k)+' '+esc(k)+'</span><span>'+f(by[k])+' ('+p+'%)</span></div><div class="b"><i style="width:'+p+'%"></i></div></div>'}).join('')+'</div>'}
  var s=L.slice().sort(function(a,c){return a.date<c.date?1:a.date>c.date?-1:c.id-a.id});
  h+='<div class="card"><h3>تۆمارەکان</h3>'+(s.length?s.map(function(x){return '<div class="tx"><span class="ib">'+ic(x.cat)+'</span><div class="m"><b>'+esc(x.cat)+'</b><small>'+x.date+(x.note?' · '+esc(x.note):'')+'</small></div><b class="'+x.type+'">'+(x.type==='in'?'+':'−')+f(x.amt)+'</b><button onclick="del('+x.id+')" aria-label="سڕینەوە">🗑</button></div>'}).join(''):'<div class="empty">هێشتا هیچ تۆمارێک نییە</div>')+'</div>';
 }else if(tab==='y'){
  var Y=inYear(vy),yi=sum(Y,'in'),yo=sum(Y,'out'),rows='';
  for(var m=0;m<12;m++){var l=inMonth(vy,m),a=sum(l,'in'),c=sum(l,'out');rows+='<tr><td>'+MN[m]+'</td><td class="in">'+f(a)+'</td><td class="out">'+f(c)+'</td><td><b>'+f(a-c)+'</b></td></tr>'}
  h+='<div class="card"><div class="nav"><button onclick="yv(1)">›</button><b>ساڵی '+vy+'</b><button onclick="yv(-1)">‹</button></div></div>';
  h+='<div class="card"><div class="sum"><div><small>کۆی داهات</small><b class="in">'+f(yi)+'</b></div><div><small>کۆی خەرجی</small><b class="out">'+f(yo)+'</b></div><div class="hero"><small>ماوە</small><b>'+f(yi-yo)+'</b></div></div></div>';
  h+='<div class="card"><h3>حیسابی مانگ بە مانگ</h3>'+chart()+'<div class="wrap"><table><thead><tr><th>مانگ</th><th>داهات</th><th>خەرجی</th><th>ماوە</th></tr></thead><tbody>'+rows+'</tbody><tfoot><tr><td>کۆی گشتی</td><td>'+f(yi)+'</td><td>'+f(yo)+'</td><td>'+f(yi-yo)+'</td></tr></tfoot></table></div></div>';
  h+='<div class="card"><div class="sum"><div><small>ناوەندی خەرجی مانگانە</small><b>'+f(yo/12)+'</b></div><div><small>ژمارەی تۆمار</small><b>'+Y.length+'</b></div><div><small>مانگی زۆرترین خەرجی</small><b>'+topM()+'</b></div></div></div>';
 }
 if(tab==='x')h=more()+debtsCard();
 $('#app').innerHTML=h;
 if(tab==='m'){$('#so').onclick=function(){ty='out';render()};$('#si').onclick=function(){ty='in';render()}}
}
function topM(){var b=-1,k='—';for(var m=0;m<12;m++){var c=sum(inMonth(vy,m),'out');if(c>b&&c>0){b=c;k=MN[m]}}return k}
function more(){var g=S.goal,p=g.target>0?Math.min(100,Math.round(g.saved/g.target*100)):0;
return '<div class="card"><h3>🎯 ئامانجی پاشەکەوت</h3>'+(g.target>0?'<div><b>'+esc(g.name||'ئامانج')+'</b>: '+f(g.saved)+' لە '+f(g.target)+' ('+p+'%)</div><div class="prog"><i style="width:'+p+'%"></i></div><div>ماوە: '+f(Math.max(0,g.target-g.saved))+'</div>':'<div class="empty">هێشتا ئامانجێکت دیاری نەکردووە</div>')+'<input id="gn" placeholder="ناوی ئامانج (وەک ئۆتۆمبێل، گەشت)" value="'+esc(g.name)+'"><input id="gt" type="number" inputmode="decimal" placeholder="بڕی ئامانج" value="'+(g.target||'')+'"><button class="add" onclick="setG()">پاشەکەوتکردنی ئامانج</button><div class="two" style="margin-top:8px"><input id="ga" type="number" inputmode="decimal" placeholder="بڕی پارە بۆ زیادکردن"><button class="add" style="width:auto;padding:0 18px;height:42px" onclick="addG()">＋ زیادکردن</button></div></div>'
+'<div class="card"><h3>💾 یەدەگ (Backup)</h3><div class="note" style="margin-top:0">کۆپی بکە و لە شوێنێکی پارێزراو (وەک Notes) هەڵیبگرە. بۆ گەڕاندنەوە، لێرە پەیستی بکە.</div><textarea id="bk"></textarea><div class="two"><button class="add" onclick="expB()">کۆپیکردنی یەدەگ</button><button class="add" onclick="impB()">گەڕاندنەوە</button></div></div>'}
function expB(){var t=$('#bk');t.value=JSON.stringify(S);t.select();try{navigator.clipboard.writeText(t.value)}catch(e){try{document.execCommand('copy')}catch(e2){}}alert('یەدەگ ئامادەیە. ئەگەر کۆپی نەبوو، دەقەکە دیاری بکە و کۆپی بکە.')}
function impB(){try{var o=JSON.parse($('#bk').value);if(!o||!Array.isArray(o.tx))throw 0;if(!confirm('داتای ئێستا دەگۆڕدرێت. دڵنیایت؟'))return;S=o;S.budget=S.budget||0;S.goal=S.goal||{name:'',target:0,saved:0};save();render();alert('گەڕایەوە ✅')}catch(e){alert('دەقی یەدەگەکە دروست نییە')}}
function setB(){S.budget=Math.max(0,parseFloat($('#bgi').value)||0);save();render()}
function setG(){S.goal.name=$('#gn').value.trim();S.goal.target=Math.max(0,parseFloat($('#gt').value)||0);save();render()}
function addG(){var a=parseFloat($('#ga').value);if(!(a>0))return;S.goal.saved+=a;save();render()}
var IC={'خۆراک':'🍽️','کرێ':'🏠','گواستنەوە':'🚗','کارەبا و ئاو':'💡','قەرز':'🤝','تەندروستی':'💊','جلوبەرگ':'👕','خوێندن':'📚','تر':'✨','مووچە':'💼','کار':'🛠️'};
function ic(c){return IC[c]||'•'}
function dueList(){var l=new Date(d.getTime()+3*864e5),lim=l.getFullYear()+'-'+pad(l.getMonth()+1)+'-'+pad(l.getDate());return S.debts.filter(function(x){return !x.done&&x.date<=lim})}
function chart(){var a=[],o=[],mx=1,m,s;for(m=0;m<12;m++){var l=inMonth(vy,m);a.push(sum(l,'in'));o.push(sum(l,'out'));mx=Math.max(mx,a[m],o[m])}
s='<div class="ch">';for(m=0;m<12;m++){s+='<div class="cc"><div class="cb"><i class="ci" style="height:'+Math.round(a[m]/mx*100)+'%"></i><i class="co" style="height:'+Math.round(o[m]/mx*100)+'%"></i></div><small>'+(m+1)+'</small></div>'}
return s+'</div><div class="lg"><span><i class="ci"></i> داهات</span><span><i class="co"></i> خەرجی</span></div>'}
function debtsCard(){var s=S.debts.slice().sort(function(a,b){return a.date<b.date?-1:1}),t=today();
return '<div class="card"><h3>📅 قەرز و پارەدانەکان</h3>'+(s.length?s.map(function(x){var od=!x.done&&x.date<t;return '<div class="tx"><span class="ib">'+(x.done?'✅':od?'⚠️':'⏳')+'</span><div class="m"><b style="'+(x.done?'text-decoration:line-through;opacity:.6':'')+'">'+esc(x.name)+'</b><small class="'+(od?'out':'')+'">'+x.date+(od?' · دواکەوتووە':'')+'</small></div><b>'+f(x.amt)+'</b><button onclick="tgD('+x.id+')" aria-label="دراوە">'+(x.done?'↩️':'☑️')+'</button><button onclick="dlD('+x.id+')" aria-label="سړینەوە">🗑</button></div>'}).join(''):'<div class="empty">هێشتا هیچ قەرزێک یان پارەدانێک نییە</div>')+'<input id="dn" placeholder="ناو (وەک قیستی ئۆتۆمبێل، کرێ)"><div class="row2"><input id="da" type="number" inputmode="decimal" placeholder="بڕی پارە"><input id="dd" type="date"></div><button class="add" onclick="adD()">زیادکردن ＋</button></div>'}
function adD(){var n=$('#dn').value.trim(),a=parseFloat($('#da').value),dt=$('#dd').value;if(!n||!(a>0)||!dt){alert('تکایە ناو، بڕی پارە و بەروار بنووسە');return}S.debts.push({id:Date.now(),name:n,amt:a,date:dt,done:false});save();render()}
function tgD(id){S.debts.forEach(function(x){if(x.id===id)x.done=!x.done});save();render()}
function dlD(id){if(confirm('دڵنیایت لە سړینەوە؟')){S.debts=S.debts.filter(function(x){return x.id!==id});save();render()}}
function mv(n){vm+=n;if(vm>11){vm=0;vy++}if(vm<0){vm=11;vy--}render()}
function yv(n){vy+=n;render()}
function add(){
 var a=parseFloat($('#am').value),dt=$('#dt').value;
 if(!(a>0)||!dt){alert('تکایە بڕی پارە و بەروار بنووسە');return}
 S.tx.push({id:Date.now(),type:ty,amt:a,cat:$('#ct').value,date:dt,note:$('#nt').value.trim()});
 save();vy=+dt.slice(0,4);vm=+dt.slice(5,7)-1;render();
}
function del(id){if(confirm('دڵنیایت لە سڕینەوە؟')){S.tx=S.tx.filter(function(x){return x.id!==id});save();render()}}
$('#tm').onclick=function(){tab='m';render()};
$('#ty').onclick=function(){tab='y';render()};
$('#tx').onclick=function(){tab='x';render()};
render();
(async function(){try{
 var u=await claude.use('user'),db=await claude.use('db');
 if(!u||!db)return;
 var id=await u.id();if(!id)return;
 var c=db.collection('data/users/'+id),sn=await c.doc('wallet').get(),first=false;
 try{first=!localStorage.getItem('jizdan_sync')}catch(e){}
 if(sn.exists){var o=JSON.parse(sn.data().data);
  if(o&&Array.isArray(o.tx)){
   if(first){var ids={};S.tx.forEach(function(x){ids[x.id]=1});o.tx.forEach(function(x){if(!ids[x.id])S.tx.push(x)});S.budget=o.budget||S.budget;S.debts=(S.debts&&S.debts.length)?S.debts:(o.debts||[]);if(o.goal&&o.goal.target)S.goal=o.goal}
   else{S=o;S.budget=S.budget||0;S.goal=S.goal||{name:'',target:0,saved:0}}}}
 DB=c;push();
 try{localStorage.setItem('jizdan_sync','1');localStorage.setItem('jizdan',JSON.stringify(S))}catch(e){}
 ui('✅ بە ئەکاونتەکەتەوە بەستراوە');render();
}catch(e){}})();
</script>
